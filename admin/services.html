<!DOCTYPE html>
<html lang=en>
<head>
    <meta charset=UTF-8>
    <meta name=viewport content=width=device-width, initial-scale=1.0>
    <title>Services Preview & Content – AR Constructions & Realtors Admin</title>
    <link rel=preconnect href=https://fonts.googleapis.com>
    <link rel=preconnect href=https://fonts.gstatic.com crossorigin>
    <link href=https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap rel=stylesheet>
    <link rel=stylesheet href=https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css>
    <link rel=stylesheet href=admin.css>
    <link rel=stylesheet href=../frontend/style.css>
    <link rel=icon type=image/png href=assets/ar-logo.png>
    <style>
        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
        }
        .admin-main {
            margin-left: 260px;
            min-height: 100vh;
            background: #090d16;
        }
    </style>
</head>
<body>
    <div class=admin-layout>
        
        <!-- Sidebar Navigation -->
        <aside class=admin-sidebar id=admin-sidebar>
            <div class=sidebar-header>
                <img src=assets/ar-logo.png alt=AR Logo class=sidebar-logo onerror=this.src='../frontend/images/ar-logo.png'>
                <div>
                    <h2 class=sidebar-title>AR CONSTRUCTIONS</h2>
                    <span class=sidebar-subtitle>& REALTORS</span>
                </div>
            </div>

            <nav class=sidebar-nav>
                <a href=dashboard.html class=nav-item>
                    <i class=fa-solid fa-chart-line></i>
                    <span>Dashboard</span>
                </a>
                <a href=bookings.html class=nav-item>
                    <i class=fa-solid fa-calendar-check></i>
                    <span>Bookings</span>
                </a>
                <a href=workspace.html class=nav-item>
                    <i class=fa-solid fa-house-laptop></i>
                    <span>Workspace</span>
                </a>
                <a href=about.html class=nav-item>
                    <i class=fa-solid fa-circle-info></i>
                    <span>About Us</span>
                </a>
                <a href=projects.html class=nav-item>
                    <i class=fa-solid fa-building-user></i>
                    <span>Projects</span>
                </a>
                <a href=services.html class=nav-item active>
                    <i class=fa-solid fa-screwdriver-wrench></i>
                    <span>Services</span>
                </a>
                <a href=settings.html class=nav-item>
                    <i class=fa-solid fa-sliders></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class=sidebar-footer>
                <button class=logout-btn onclick=handleLogout()>
                    <i class=fa-solid fa-arrow-right-from-bracket></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class=admin-main>
            <!-- Topbar -->
            <header class=admin-topbar>
                <div class=topbar-left>
                    <button class=mobile-menu-btn id=mobile-menu-btn aria-label=Toggle menu>
                        <i class=fa-solid fa-bars></i>
                    </button>
                    <h1 class=page-title>Services – Admin View</h1>
                </div>

                <div class=user-profile>
                    <div class=user-avatar id=user-initial>A</div>
                    <div class=user-info>
                        <span class=user-name id=user-email>Administrator</span>
                        <span class=user-role>Super Admin</span>
                    </div>
                </div>
            </header>

        </main>
    </div>

    <script src=admin.js></script>
</body>
</html>
